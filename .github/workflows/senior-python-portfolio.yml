name: Senior Python Portfolio Tests
on:
  push:
    paths:
      - 'senior-python-portfolio/**'
      - '.github/workflows/senior-python-portfolio.yml'
  pull_request:
    paths:
      - 'senior-python-portfolio/**'
      - '.github/workflows/senior-python-portfolio.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python senior-python-portfolio/run_tests.py
